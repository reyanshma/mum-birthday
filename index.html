
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Birthday, Mum</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --pink: #a94462;
  --cream: #fff5f1;
  --text: #482d35;
}

body {
  margin: 0;
  font-family: "Trebuchet MS", "Segoe UI", sans-serif;
  background: var(--cream);
  color: var(--text);
}

.hero {
  min-height: 72vh;
  padding: 50px 18px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  position: relative;
  overflow: hidden;
}

.hero::before,
.hero::after {
  position: absolute;
  z-index: 0;
  color: var(--pink);
  opacity: .14;
  font-size: clamp(120px, 26vw, 280px);
  animation: float 7s ease-in-out infinite;
  pointer-events: none;
}

.hero::before {
  content: "✿";
  top: 2%;
  left: -4%;
}

.hero::after {
  content: "❀";
  right: -3%;
  bottom: 0;
  animation-delay: -3s;
}

h1, h2 {
  position: relative;
  z-index: 1;
}

h1 {
  color: var(--pink);
  font-family: "Brush Script MT", "Segoe Script", cursive;
  font-size: clamp(3.2rem, 12vw, 7.8rem);
  line-height: 1;
  font-weight: 500;
  margin: 20px 0 16px;
  animation: rise 1s both;
}

h2 {
  font-family: "Brush Script MT", "Segoe Script", cursive;
  font-size: clamp(2rem, 7vw, 4rem);
  font-weight: 500;
  margin: 0;
  animation: rise 1s .2s both;
}

.photos {
  max-width: 1000px;
  margin: 0 auto;
  padding: 20px 22px 70px;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 24px;
}

.photo-card {
  background: #fffdfb;
  border: 1px solid #efd7d5;
  border-radius: 24px;
  padding: 13px;
  box-shadow: 0 14px 35px #6f35410c;
  transform: rotate(-1deg);
  transition: transform .25s;
  animation: rise .9s both;
}

.photo-card:nth-child(2) {
  transform: rotate(1deg);
  animation-delay: .15s;
}

.photo-card:hover {
  transform: rotate(0) translateY(-5px);
}

.photo-frame {
  aspect-ratio: 4 / 5;
  width: 100%;
  border-radius: 16px;
  overflow: hidden;
  background: #f5d8d4;
}

.photo-frame img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.photo-caption {
  font-family: "Brush Script MT", "Segoe Script", cursive;
  color: var(--pink);
  text-align: center;
  font-size: 1.65rem;
  padding: 14px 4px 5px;
}

@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(18px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes float {
  0%, 100% {
    transform: translateY(0) rotate(0);
  }
  50% {
    transform: translateY(-18px) rotate(8deg);
  }
}

@media (max-width: 620px) {
  .hero {
    min-height: 65vh;
  }

  .photos {
    grid-template-columns: 1fr;
    max-width: 440px;
    padding: 15px 18px 50px;
  }

  .photo-frame {
    aspect-ratio: 4 / 4.2;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>

<body>
<main>

  <section class="hero">
    <h1>Happy Birthday</h1>
    <h2>to the best Mum ever ♡</h2>
  </section>

  <section class="photos">

    <article class="photo-card">
      <div class="photo-frame">
        <img
          src="mum-photo-1.jpeg"
          alt="A favourite photo of Mum">
      </div>
      <div class="photo-caption">A favourite memory</div>
    </article>

    <article class="photo-card">
      <div class="photo-frame">
        <img
          src="mum-photo-2.jpeg"
          alt="Another special photo of Mum">
      </div>
      <div class="photo-caption">A special moment</div>
    </article>

  </section>

</main>
</body>
</html>
